<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RXVNCE</title>
<style>
:root{--bg:#000;--p1:#0a0a0a;--p2:#111;--p3:#181818;--line:#1b1b1b;--line2:#2a2a2a;--tx:#fff;--mu:#8a8a8a;--mu2:#5c5c5c;--ac:#fff;--pl:92px;--nav:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#222;border-radius:10px;border:2px solid #000}::-webkit-scrollbar-track{background:transparent}
.shell{display:grid;grid-template-columns:232px 1fr;height:calc(100% - var(--pl));}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{font-size:22px;font-weight:900;letter-spacing:.3em;padding:0 10px 22px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mu);font-weight:600;text-align:left;width:100%}
.nav:hover{color:#fff;background:var(--p2)}.nav.on{color:#fff;background:var(--p3)}
.nav svg{width:20px;height:20px;flex:none}
.sidehead{color:var(--mu2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:18px 12px 6px;display:flex;justify-content:space-between;align-items:center}
.sidehead button{font-size:18px;color:var(--mu)}.sidehead button:hover{color:#fff}
.mini{padding:8px 12px;color:var(--mu);border-radius:8px;text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini:hover{color:#fff;background:var(--p2)}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:12px;align-items:center;padding:16px 28px;position:relative}
.sbox{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--line2);border-radius:999px;padding:0 16px}
.sbox:focus-within{border-color:#666}
.sbox svg{width:18px;height:18px;color:var(--mu);flex:none}
.sbox input{flex:1;background:none;border:0;outline:0;padding:12px 0;min-width:0}
.sbox kbd{font:11px monospace;color:var(--mu2);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}.iconbtn:hover{color:#fff;background:var(--p3)}.iconbtn.on{color:#fff}
.iconbtn svg{width:20px;height:20px}
main{flex:1;overflow:auto;padding:4px 28px 40px;min-height:0}
h1{font-size:36px;margin:8px 0 4px;letter-spacing:-.02em}h2{font-size:20px;margin:30px 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sub{color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{padding:7px 14px;border-radius:999px;background:var(--p2);border:1px solid var(--line2);color:var(--mu);font-weight:600;font-size:13px}
.chip:hover{color:#fff;border-color:#555}.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;position:relative;text-align:left}
.card:hover{background:var(--p3);border-color:var(--line2);transform:translateY(-2px)}
.art{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1a1a1a,#050505);display:grid;place-items:center;color:#333;font-weight:900;letter-spacing:.1em}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.round{border-radius:50%}
.card .t{font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card .go{position:absolute;right:20px;bottom:64px;width:42px;height:42px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.18s;box-shadow:0 6px 20px #000}
.card:hover .go{opacity:1;transform:none}.go svg{width:18px;height:18px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:34px minmax(0,4fr) minmax(0,2fr) 80px 54px 34px;gap:12px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--p2)}.row.on{background:var(--p3)}
.row.on .rt{color:#fff}
.rn{color:var(--mu2);text-align:center;font-variant-numeric:tabular-nums}
.row.on .rn{color:#fff}
.rm{display:flex;gap:12px;align-items:center;min-width:0}
.rm .art{width:44px;flex:none;border-radius:6px;font-size:10px}
.rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra a{cursor:pointer}.ra a:hover{color:#fff;text-decoration:underline}
.rg,.rp,.rd{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:5px;border:1px solid #333;color:#aaa;margin-left:8px;vertical-align:middle}
.badge.full{border-color:#fff;color:#fff}
.more{color:var(--mu);opacity:0}.row:hover .more,.more:focus{opacity:1}
.more:hover{color:#fff}
.hd{display:flex;gap:22px;align-items:flex-end;padding:18px 0}
.hd .art{width:180px;flex:none}
.hd .meta{min-width:0}
.btns{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:999px;font-weight:800;border:1px solid var(--line2);background:var(--p2)}
.btn:hover{border-color:#777}
.btn.pri{background:#fff;color:#000;border-color:#fff}
.btn.pri:hover{background:#ddd}
.status{color:var(--mu);padding:22px 4px}
.status b{color:#fff}
.err{border:1px solid #3a1a1a;background:#0d0505;color:#e99;border-radius:12px;padding:14px 16px;margin:10px 0}
.err button{margin-left:10px;text-decoration:underline;color:#fff}
.hscroll{display:flex;gap:18px;overflow:auto;padding-bottom:8px}
.hscroll .card{flex:0 0 160px}
.skel{height:44px;border-radius:10px;background:linear-gradient(90deg,#0a0a0a,#151515,#0a0a0a);background-size:200% 100%;animation:sk 1.2s infinite;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
/* player */
.player{position:fixed;left:0;right:0;bottom:var(--nav);height:var(--pl);background:#030303;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(200px,1fr) minmax(320px,2fr) minmax(200px,1fr);align-items:center;gap:16px;padding:0 20px;z-index:20}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.now .art{width:58px;flex:none;border-radius:8px;font-size:10px}
.now .nt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .na{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ctrls{display:flex;align-items:center;gap:14px}
.ctrls .iconbtn{width:34px;height:34px}
.pp{width:42px!important;height:42px!important;background:#fff;color:#000!important;border-radius:50%}
.pp:hover{transform:scale(1.06);background:#fff!important}
.pp svg{width:20px!important;height:20px!important}
.seekrow{display:flex;align-items:center;gap:10px;width:100%;color:var(--mu);font-size:11.5px;font-variant-numeric:tabular-nums}
.seekrow span{width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;background:transparent;width:100%;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p),#2a2a2a var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p),#2a2a2a var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:0;transition:.1s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus::-webkit-slider-thumb{opacity:1}
.right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.right input{width:100px}
.heart.liked svg{fill:#fff;color:#fff}
/* panel */
.panel{position:fixed;top:0;right:0;bottom:var(--pl);width:380px;background:#050505;border-left:1px solid var(--line);z-index:15;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column}
.panel.open{transform:none}
.tabs{display:flex;gap:4px;padding:14px 14px 0;border-bottom:1px solid var(--line)}
.tab{padding:10px 14px;color:var(--mu);font-weight:700;border-bottom:2px solid transparent}
.tab.on{color:#fff;border-color:#fff}
.pbody{flex:1;overflow:auto;padding:14px}
.qrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.qrow:hover{background:var(--p2)}.qrow.on{background:var(--p3)}
.qrow .art{width:38px;flex:none;border-radius:5px;font-size:8px}
.qrow .qt{flex:1;min-width:0}
.qrow .x{color:var(--mu2)}.qrow .x:hover{color:#fff}
.info .art{width:100%;margin-bottom:14px}
.info h3{margin:0 0 2px;font-size:20px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px 10px;margin-top:16px;font-size:13px}
.kv dt{color:var(--mu2)}.kv dd{margin:0;word-break:break-word}
.tag{display:inline-block;background:var(--p3);border:1px solid var(--line2);border-radius:999px;padding:2px 10px;margin:0 4px 4px 0;font-size:12px;color:var(--mu)}
.lyr{font-size:19px;font-weight:700;line-height:1.55}
.lyr p{margin:0 0 6px;color:#444;cursor:pointer;transition:.2s}
.lyr p.on{color:#fff}.lyr p.past{color:#777}
.lyr.plain p{color:#bbb;font-size:15px;font-weight:500;cursor:default}
/* menu/toast/modal */
.menu{position:fixed;z-index:60;background:#0d0d0d;border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 18px 50px #000;max-height:60vh;overflow:auto}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.menu button:hover{background:var(--p3)}.menu hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
.menu .hl{color:var(--mu2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--pl) + var(--nav) + 18px);transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.bnav{display:none}
@media(max-width:900px){
 :root{--pl:68px;--nav:58px}
 .shell{grid-template-columns:1fr;height:calc(100% - var(--pl) - var(--nav))}
 .side{display:none}
 .top{padding:12px 14px}.sbox kbd{display:none}
 main{padding:4px 14px 30px}
 h1{font-size:28px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .row{grid-template-columns:44px minmax(0,1fr) 44px 30px}.row .rn,.row .rg,.row .rp{display:none}
 .hd{flex-direction:column;align-items:flex-start}.hd .art{width:140px}
 .player{grid-template-columns:1fr auto;padding:0 12px;gap:8px;border-bottom:1px solid var(--line)}
 .center{position:static}.center .seekrow{position:absolute;left:0;right:0;top:-8px;padding:0}
 .center .seekrow span{display:none}
 .center .ctrls .m-hide{display:none}.right{display:none}
 .now .art{width:44px}
 .panel{width:100%;bottom:calc(var(--pl) + var(--nav))}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:#000;border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
 .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mu);font-size:10.5px;font-weight:700}
 .bnav button.on{color:#fff}.bnav svg{width:22px;height:22px}
 .toast{bottom:calc(var(--pl) + var(--nav) + 14px)}
}
/* ===== v4: neon layer (AMOLED black stays; accent shifts hue with the playing track) ===== */
@property --h{syntax:'<number>';inherits:true;initial-value:190}
:root{--h:190;transition:--h .9s ease;
 --neon:hsl(var(--h) 100% 62%);--neon2:hsl(calc(var(--h) + 70) 100% 68%);
 --glow:hsl(var(--h) 100% 60% / .55);--glow2:hsl(var(--h) 100% 60% / .16);--edge:hsl(var(--h) 100% 60% / .35)}
.logo{text-shadow:0 0 12px var(--glow),0 0 32px var(--glow2)}
.nav{transition:.15s}
.nav.on{box-shadow:inset 3px 0 0 var(--neon),0 0 20px var(--glow2);color:#fff}
.nav.on svg{color:var(--neon);filter:drop-shadow(0 0 5px var(--neon))}
.nav:hover{box-shadow:0 0 16px var(--glow2)}
.sw{position:relative;flex:1;max-width:620px}.sw .sbox{max-width:none}
.sbox{transition:.18s}
.sbox:focus-within{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 26px var(--glow2)}
.chip{transition:.15s}
.chip:hover{border-color:var(--neon);color:#fff;box-shadow:0 0 14px var(--glow2)}
.chip.on{background:var(--neon);border-color:var(--neon);color:#000;box-shadow:0 0 16px var(--glow)}
.card,.topc{position:relative;overflow:hidden}
.card::before,.topc::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),var(--glow2),transparent 70%);opacity:0;transition:opacity .2s;pointer-events:none}
.card:hover::before,.topc:hover::before{opacity:1}
.card:hover,.topc:hover{border-color:var(--edge);box-shadow:0 0 28px var(--glow2)}
.card .go,.topc .go{background:var(--neon);box-shadow:0 0 22px var(--glow)}
.row{transition:background .12s,box-shadow .12s}
.row:hover{box-shadow:inset 0 0 0 1px var(--edge),0 0 22px var(--glow2)}
.row.on{box-shadow:inset 3px 0 0 var(--neon),0 0 24px var(--glow2)}
.row.on .rt{color:var(--neon);text-shadow:0 0 10px var(--glow)}
.badge.full{border-color:var(--neon);color:var(--neon);box-shadow:0 0 8px var(--glow2)}
.btn{transition:.15s}.btn:hover{border-color:var(--neon);box-shadow:0 0 18px var(--glow2)}
.btn.pri{box-shadow:0 0 22px var(--glow)}.btn.pri:hover{background:#fff;box-shadow:0 0 36px var(--neon)}
.pp{box-shadow:0 0 22px var(--glow)}.pp:hover{box-shadow:0 0 34px var(--neon)}
.iconbtn:hover{box-shadow:0 0 16px var(--glow2)}
.heart.liked svg{fill:var(--neon);color:var(--neon);filter:drop-shadow(0 0 6px var(--neon))}
input[type=range]{filter:drop-shadow(0 0 5px var(--glow))}
input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--neon2),var(--neon)) no-repeat,#262626;background-size:var(--p) 100%,100% 100%}
input[type=range]::-moz-range-track{background:linear-gradient(90deg,var(--neon2),var(--neon)) no-repeat,#262626;background-size:var(--p) 100%,100% 100%}
input[type=range]::-webkit-slider-thumb{box-shadow:0 0 10px var(--neon)}
input[type=range]::-moz-range-thumb{box-shadow:0 0 10px var(--neon)}
.player{box-shadow:0 -14px 44px -26px var(--glow)}
.player::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.55}
.now .art{box-shadow:0 0 22px var(--glow2),0 0 0 1px var(--edge)}
.info .art{box-shadow:0 0 50px var(--glow2),0 0 0 1px var(--edge)}
.tab.on{border-color:var(--neon);text-shadow:0 0 10px var(--glow)}
.toast{box-shadow:0 0 30px var(--glow)}
.menu{box-shadow:0 18px 50px #000,0 0 0 1px var(--edge),0 0 30px var(--glow2)}
.err{box-shadow:none}
.tag{border-color:var(--edge)}
/* equalizer on the playing row */
.rn{position:relative;height:16px}
.rn .eq{display:none;gap:2px;align-items:flex-end;justify-content:center;height:14px}
.rn .eq i{width:3px;background:var(--neon);box-shadow:0 0 6px var(--neon);border-radius:2px;animation:eq 0.9s ease-in-out infinite}
.rn .eq i:nth-child(2){animation-delay:-.3s}.rn .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.row.on .rn .num{display:none}.row.on .rn .eq{display:flex}
body.paused .eq i{animation-play-state:paused}
/* search UX */
.sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#070707;border:1px solid var(--line2);border-radius:16px;padding:6px;z-index:50;box-shadow:0 24px 60px #000,0 0 0 1px var(--edge),0 0 40px var(--glow2);max-height:70vh;overflow:auto}
.sug[hidden]{display:none}
.sg{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer}
.sg:hover,.sg.on{background:var(--p3);box-shadow:inset 0 0 0 1px var(--edge)}
.sgi{width:38px;height:38px;flex:none;display:grid;place-items:center;color:var(--mu);font-size:18px}
.sgi .art{width:38px;border-radius:6px;font-size:9px}.sgi .art.round{border-radius:50%}
.sgt{flex:1;min-width:0}.sgl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sg .x{color:var(--mu2);padding:4px 8px}.sg .x:hover{color:#fff}
.topgrid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:28px;align-items:start}
.topc{background:linear-gradient(160deg,#101010,#050505);border:1px solid var(--line2);border-radius:18px;padding:22px;cursor:pointer;transition:.18s}
.topc .art{width:112px;margin-bottom:18px;box-shadow:0 0 30px var(--glow2)}
.topc .art.big,.hd .art.big{width:150px}
.tn{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px;word-break:break-word}
.ts{color:var(--mu);display:flex;align-items:center;gap:10px}
.pill{background:#000;border:1px solid var(--edge);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.topc .go{position:absolute;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;border:0}
.topc:hover .go{opacity:1;transform:none}.topc .go svg{width:22px;height:22px}
.av{background:radial-gradient(circle at 30% 20%,hsl(var(--ah) 90% 48% / .6),#050505 75%);color:#fff;font-size:24px;text-shadow:0 0 14px hsl(var(--ah) 100% 70%)}
.av.big{font-size:44px}
a.lnk{cursor:pointer;text-decoration:underline;color:#fff}
.card .t,.card .a{display:block}
.modal{position:fixed;inset:0;background:#000c;z-index:80;display:grid;place-items:center;padding:16px}
.mbox{background:#080808;border:1px solid var(--line2);border-radius:18px;padding:22px;width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 0 0 1px var(--edge),0 0 60px var(--glow2)}
.mbox h3{margin:18px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2)}
.stl{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
.stl .sub{margin-left:auto;font-size:12.5px}
.stl .dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.stl.ok .dot{background:#3dff9a;box-shadow:0 0 10px #3dff9a}.stl.bad .dot{background:#ff4d6d;box-shadow:0 0 10px #ff4d6d}
.stl.ok .sub{color:#7dffbf}.stl.bad .sub{color:#ff8fa3}
#btnBack{font-size:26px;line-height:1;padding-bottom:3px}
.spacer-grow{flex:1}
@media(max-width:900px){.topgrid{grid-template-columns:1fr;gap:6px}.topc .art{width:84px}.tn{font-size:22px}.topc .go{opacity:1;transform:none;width:44px;height:44px}.sw{max-width:none}#btnBack{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<script>
'use strict';
/* =========================================================
   RXVNCE v3 — 100% static web app
   Sources:
     Audius        full-length tracks, free, no key, CORS-enabled (api.audius.co)
     Apple/iTunes  30-second previews of mainstream songs (itunes.apple.com/search)
     YouTube beta  via public Piped instances (best effort, may be down)
     LRCLIB        synced lyrics (lrclib.net)
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('rx3_'+k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem('rx3_'+k,JSON.stringify(v))}catch{}}};
const fmt=s=>{if(!Number.isFinite(s)||s<0)return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const nfmt=n=>n==null?'':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
const ICON={
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
 wait:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 3a9 9 0 1 0 9 9"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur=".8s" repeatCount="indefinite"/></path></svg>',
 rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
 rep1:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3M11 10h1.5v5"/></svg>',
 vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
 mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/></svg>',
 dots:'<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'
};

/* ---------- network helpers ---------- */
async function fj(url,ms=7000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
function jsonp(url,ms=8000){
  return new Promise((res,rej)=>{
    const cb='rxcb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
    const done=()=>{clearTimeout(to);delete window[cb];s.remove()};
    const to=setTimeout(()=>{done();rej(Error('jsonp timeout'))},ms);
    window[cb]=d=>{done();res(d)};s.onerror=()=>{done();rej(Error('jsonp error'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s);
  });
}

/* ---------- Audius ---------- */
const AU_HOSTS=['https://api.audius.co','https://discoveryprovider.audius.co','https://discoveryprovider2.audius.co','https://discoveryprovider3.audius.co'];
let auHost=AU_HOSTS[0];
async function au(path,params={}){
  const qs=new URLSearchParams({app_name:'RXVNCE',...params}).toString();let err;
  for(const h of [auHost,...AU_HOSTS.filter(x=>x!==auHost)]){
    try{const j=await fj(`${h}/v1${path}?${qs}`,7000);if(j&&j.data!==undefined){auHost=h;return j.data}throw Error('bad payload')}catch(e){err=e}
  }
  throw err||Error('Audius unreachable');
}
const pick=(o,...k)=>{for(const x of k)if(o&&o[x])return o[x];return''};
function normAu(r){
  if(!r||!r.id||r.is_streamable===false||r.is_delete)return null;
  const a=r.artwork||{};
  return{key:'au:'+r.id,src:'au',id:r.id,title:r.title||'Untitled',artist:r.user?.name||'Unknown artist',artistId:r.user?.id,
    art:pick(a,'480x480','1000x1000','150x150'),artSm:pick(a,'150x150','480x480'),dur:r.duration||0,genre:r.genre||'',mood:r.mood||'',
    year:String(r.release_date||r.created_at||'').slice(0,4),plays:r.play_count,tags:r.tags||'',desc:r.description||'',license:r.license||''};
}
function normAuUser(u){return{id:u.id,name:u.name,handle:u.handle,pic:pick(u.profile_picture||{},'480x480','150x150'),followers:u.follower_count,tracks:u.track_count,verified:u.is_verified}}

/* ---------- text normalising + relevance ranking ---------- */
const nz=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,' ').replace(/\b(feat|ft|featuring)\b.*$/,' ').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const JUNK=/karaoke|tribute|8d audio|slowed|reverb|sped up|nightcore|cover version|made famous|originally performed/i;
function relevance(q,t,rank){
  const Q=nz(q),qt=Q.split(' ').filter(Boolean),T=nz(t.title),A=nz(t.artist),hay=T+' '+A+' '+nz(t.album);
  let s=0;
  if(T===Q)s+=60;else if(T.startsWith(Q))s+=40;else if(T.includes(Q))s+=25;
  if(A===Q)s+=35;else if(A.includes(Q))s+=20;
  if(A+' '+T===Q||T+' '+A===Q)s+=50;
  const hit=qt.filter(w=>hay.includes(w)).length;
  s+=30*hit/Math.max(1,qt.length);
  if(hit<qt.length*.5)s-=25;
  s+=Math.max(0,20-rank*.6);
  if(t.src==='au'&&t.plays&&hit>=qt.length*.5)s+=Math.min(10,Math.log10(t.plays+1)*2);
  if(JUNK.test(t.title+' '+(t.album||''))&&!JUNK.test(q))s-=40;
  return s;
}

/* ---------- Apple / iTunes catalog (metadata + 30s previews) ---------- */
const IT='https://itunes.apple.com';
const CC=((navigator.language||'en-US').split('-')[1]||'US').toLowerCase();
const CCOK=/^[a-z]{2}$/.test(CC),CCQ=CCOK?'&country='+CC:'';
const itj=async url=>{try{return await fj(url,6000)}catch{return await jsonp(url)}};
const art600=u=>String(u||'').replace(/\d+x\d+bb\./,'600x600bb.');
function normAp(r){
  return{key:'ap:'+r.trackId,src:'ap',id:String(r.trackId),title:r.trackName,artist:r.artistName,album:r.collectionName||'',
    albumId:r.collectionId?String(r.collectionId):'',apArtist:r.artistId?String(r.artistId):'',
    art:art600(r.artworkUrl100),artSm:r.artworkUrl100||'',dur:(r.trackTimeMillis||30000)/1000,fullDur:(r.trackTimeMillis||0)/1000,
    genre:r.primaryGenreName||'',year:String(r.releaseDate||'').slice(0,4),url:r.previewUrl,explicit:r.trackExplicitness==='explicit',link:r.trackViewUrl,no:r.trackNumber};
}
const normApAlbum=r=>({id:String(r.collectionId),title:r.collectionName,artist:r.artistName,apArtist:r.artistId?String(r.artistId):'',
  art:art600(r.artworkUrl100),year:String(r.releaseDate||'').slice(0,4),count:r.trackCount,genre:r.primaryGenreName||''});
const songOk=r=>r.trackId&&r.trackName&&r.previewUrl;
async function apSearchAll(q){
  const base=IT+'/search?media=music&term='+encodeURIComponent(q)+CCQ;
  const [s,al,ar]=await Promise.allSettled([itj(base+'&entity=song&limit=40'),itj(base+'&entity=album&limit=12'),itj(base+'&entity=musicArtist&limit=6')]);
  const ok=x=>x.status==='fulfilled'?(x.value.results||[]):null;
  if(!ok(s)&&!ok(al)&&!ok(ar))throw s.reason||Error('Apple catalog unreachable');
  return{songs:(ok(s)||[]).filter(songOk).map(normAp),
    albums:(ok(al)||[]).filter(r=>r.collectionId&&r.collectionName).map(normApAlbum),
    artists:(ok(ar)||[]).filter(r=>r.artistId).map(r=>({id:String(r.artistId),name:r.artistName,genre:r.primaryGenreName||''}))};
}
async function apSuggest(q){
  const b=IT+'/search?media=music&term='+encodeURIComponent(q)+CCQ;
  const g=async(e,l)=>{try{return(await itj(b+'&entity='+e+'&limit='+l)).results||[]}catch{return[]}};
  const [s,a,al]=await Promise.all([g('song',5),g('musicArtist',3),g('album',2)]);
  return{songs:s.filter(r=>r.trackId&&r.trackName).map(normAp),
    artists:a.filter(r=>r.artistId).map(r=>({id:String(r.artistId),name:r.artistName,genre:r.primaryGenreName||''})),
    albums:al.filter(r=>r.collectionId).map(normApAlbum)};
}
async function apAlbum(id){
  const j=await itj(IT+'/lookup?id='+encodeURIComponent(id)+'&entity=song&limit=200'+CCQ),r=j.results||[];
  const al=r.find(x=>x.wrapperType==='collection');
  return{album:al?normApAlbum(al):null,tracks:r.filter(x=>x.wrapperType==='track'&&x.trackId&&x.previewUrl).map(normAp).sort((a,b)=>(a.no||0)-(b.no||0))};
}
async function apArtist(id){
  const [a,b]=await Promise.all([itj(IT+'/lookup?id='+encodeURIComponent(id)+'&entity=song&limit=30'+CCQ),
    itj(IT+'/lookup?id='+encodeURIComponent(id)+'&entity=album&limit=40'+CCQ).catch(()=>({results:[]}))]);
  const ar=(a.results||[]).find(x=>x.wrapperType==='artist')||(b.results||[]).find(x=>x.wrapperType==='artist')||{};
  const seen=new Set();
  const albums=(b.results||[]).filter(x=>x.wrapperType==='collection'&&x.collectionName).map(normApAlbum).filter(x=>{const k=nz(x.title);if(seen.has(k))return false;seen.add(k);return true});
  return{name:ar.artistName||'',genre:ar.primaryGenreName||'',songs:(a.results||[]).filter(x=>x.wrapperType==='track'&&x.previewUrl).map(normAp),albums};
}
async function apCharts(){
  const j=await fj(`https://rss.applemarketingtools.com/api/v2/${CCOK?CC:'us'}/music/most-played/25/songs.json`,6000);
  const ids=((j.feed&&j.feed.results)||[]).map(x=>x.id).filter(Boolean);if(!ids.length)throw Error('no chart');
  const l=await itj(IT+'/lookup?id='+ids.join(',')+'&entity=song'+CCQ);
  const m=new Map((l.results||[]).filter(x=>x.trackId&&x.previewUrl).map(x=>[String(x.trackId),normAp(x)]));
  const out=ids.map(i=>m.get(String(i))).filter(Boolean);if(!out.length)throw Error('empty chart');return out;
}

/* ---------- YouTube bridge: Piped + Invidious (best effort, many public instances raced) ---------- */
const PIPED_FALLBACK=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee','https://pipedapi.adminforge.de','https://pipedapi.leptons.xyz','https://pipedapi.drgns.space','https://pipedapi.owo.si','https://pipedapi.reallyaweso.me'];
const INV_FALLBACK=['https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de','https://invidious.privacyredirect.com'];
let ytBack=null;
async function ytBackends(){
  if(ytBack)return ytBack;
  const [pi,iv]=await Promise.allSettled([fj('https://piped-instances.kavin.rocks/',4000),fj('https://api.invidious.io/instances.json?sort_by=health',4000)]);
  const P=[],I=[];
  if(pi.status==='fulfilled'&&Array.isArray(pi.value))pi.value.filter(x=>x.api_url&&(x.uptime_24h==null||x.uptime_24h>70)).sort((a,b)=>(b.uptime_24h||0)-(a.uptime_24h||0)).forEach(x=>P.push(x.api_url.replace(/\/$/,'')));
  PIPED_FALLBACK.forEach(h=>{if(!P.includes(h))P.push(h)});
  if(iv.status==='fulfilled'&&Array.isArray(iv.value))iv.value.filter(e=>e[1]&&e[1].api===true&&e[1].type==='https'&&e[1].uri).forEach(e=>I.push(e[1].uri.replace(/\/$/,'')));
  INV_FALLBACK.forEach(h=>{if(!I.includes(h))I.push(h)});
  const out=[];for(let i=0;i<Math.max(P.length,I.length);i++){if(P[i])out.push({k:'p',h:P[i]});if(I[i])out.push({k:'i',h:I[i]})}
  return ytBack=out;
}
const ytAny=async fn=>Promise.any((await ytBackends()).slice(0,10).map(b=>fn(b)));
const ytThumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
async function ytSearchRaw(q){
  return ytAny(async b=>{
    let r;
    if(b.k==='p'){
      const j=await fj(b.h+'/search?q='+encodeURIComponent(q)+'&filter=music_songs',6000);if(!j||j.error)throw Error('bad');
      r=(j.items||[]).filter(x=>x.url&&/watch\?v=/.test(x.url)).map(x=>({id:new URL(x.url,'https://x').searchParams.get('v'),title:x.title||'',artist:(x.uploaderName||'').replace(/ - Topic$/,''),topic:/ - Topic$/.test(x.uploaderName||''),dur:x.duration||0}));
    }else{
      const j=await fj(b.h+'/api/v1/search?q='+encodeURIComponent(q)+'&type=video',6000);
      r=(Array.isArray(j)?j:[]).filter(x=>x.type==='video'&&x.videoId).map(x=>({id:x.videoId,title:x.title||'',artist:(x.author||'').replace(/ - Topic$/,''),topic:/ - Topic$/.test(x.author||''),dur:x.lengthSeconds||0}));
    }
    r=r.filter(x=>x.id);if(!r.length)throw Error('empty');return r;
  });
}
async function ytSearchTracks(q){
  const r=await ytSearchRaw(q);
  return r.map(x=>({key:'yt:'+x.id,src:'yt',id:x.id,title:x.title,artist:x.artist||'YouTube',art:ytThumb(x.id),artSm:ytThumb(x.id),dur:x.dur,genre:'',year:''}));
}
async function ytStream(id){
  return ytAny(async b=>{
    if(b.k==='p'){
      const j=await fj(b.h+'/streams/'+encodeURIComponent(id),8000);if(!j||j.error)throw Error('bad');
      const a=(j.audioStreams||[]).filter(s=>s.url);if(!a.length)throw Error('no audio');
      const m4a=a.filter(s=>/mp4|m4a/i.test((s.mimeType||'')+(s.format||'')));
      const best=(m4a.length?m4a:a).sort((x,y)=>(y.bitrate||0)-(x.bitrate||0))[0];
      // Piped stream URLs are bound to the instance's IP: they must be fetched through its media proxy.
      if(j.proxyUrl){const u=new URL(best.url);u.searchParams.set('host',u.host);u.host=new URL(j.proxyUrl).host;return u.toString()}
      return best.url;
    }
    const j=await fj(b.h+'/api/v1/videos/'+encodeURIComponent(id)+'?local=true&fields=adaptiveFormats',8000);
    const a=(j.adaptiveFormats||[]).filter(s=>/^audio\//.test(s.type||'')&&s.url);if(!a.length)throw Error('no audio');
    const m4a=a.filter(s=>/mp4/.test(s.type));
    const best=(m4a.length?m4a:a).sort((x,y)=>(+y.bitrate||0)-(+x.bitrate||0))[0];
    return best.url.startsWith('/')?b.h+best.url:best.url;
  });
}
/* find the YouTube upload that matches an Apple catalog track (title, artist, duration, "- Topic" auto uploads) */
const VARIANT=/live|cover|karaoke|reaction|slowed|reverb|sped up|nightcore|8d|remix|instrumental|lyrics|acoustic/i;
async function ytMatch(t){
  const cache=store.get('ytmap',{});if(cache[t.key])return cache[t.key];
  const items=await ytSearchRaw(`${t.artist} ${t.title}`);
  const tt=nz(t.title).split(' ').filter(Boolean),aa=nz(t.artist).split(' ').filter(Boolean);
  let best=null,bs=-1e9;
  for(const it of items){
    const T=nz(it.title+' '+it.artist);let s=0;
    s+=40*tt.filter(w=>T.includes(w)).length/Math.max(1,tt.length);
    s+=25*aa.filter(w=>T.includes(w)).length/Math.max(1,aa.length);
    if(it.topic)s+=20;
    if(t.fullDur&&it.dur){const d=Math.abs(it.dur-t.fullDur);s+=d<=3?30:d<=8?15:d<=20?0:-60}
    if(VARIANT.test(it.title)&&!VARIANT.test(t.title))s-=35;
    if(s>bs){bs=s;best=it}
  }
  if(!best||bs<45)throw Error('no confident YouTube match');
  cache[t.key]=best.id;const ks=Object.keys(cache);if(ks.length>300)delete cache[ks[0]];store.set('ytmap',cache);
  return best.id;
}

/* ---------- Lyrics (LRCLIB) ---------- */
const lyCache=new Map();
async function getLyrics(t){
  if(lyCache.has(t.key))return lyCache.get(t.key);
  const p=new URLSearchParams({artist_name:t.artist,track_name:t.title});if(t.fullDur||t.dur)p.set('duration',Math.round(t.fullDur||t.dur));
  let r=null;
  try{r=await fj('https://lrclib.net/api/get?'+p,6000)}catch{
    try{const a=await fj('https://lrclib.net/api/search?q='+encodeURIComponent(t.artist+' '+t.title),6000);r=a[0]||null}catch{}
  }
  let out=null;
  if(r&&(r.syncedLyrics||r.plainLyrics)){
    if(r.syncedLyrics){out={synced:r.syncedLyrics.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);return m?{t:+m[1]*60+ +m[2],s:m[3]}:null}).filter(Boolean)}}
    else out={plain:r.plainLyrics}
  }
  lyCache.set(t.key,out);return out;
}

/* ---------- playback engine ---------- */
let loadTok=0,failStreak=0,shufHist=[],warned=false;const resCache=new Map(),failAt={};
function setPlayIcon(){const b=$('#btnPlay');b.innerHTML=audio.paused?ICON.play:ICON.pause;document.body.classList.toggle('paused',audio.paused)}

function syncNow(){
  const t=cur();
  $('#nowT').textContent=t?t.title:'Nothing playing';
  $('#nowA').textContent=t?t.artist+(t.mode==='preview'?' · 30s preview':''):'Search for something';

  $('#nowArt').innerHTML=t?(esc(initials(t.artist))+(t.art?`<img src="${esc(t.art)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:'')):'RX';
  document.title=t?`${t.title} · ${t.artist} — RXVNCE`:'RXVNCE';
  syncLike();setPlayIcon();$$('.row').forEach(r=>r.classList.toggle('on',!!t&&r.dataset.key===t.key));
  if('mediaSession'in navigator){
    if(t)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album||'RXVNCE',artwork:t.art?[{src:t.art,sizes:'512x512'}]:[]});
  }
}
const auStream=id=>`${auHost}/v1/tracks/${encodeURIComponent(id)}/stream?app_name=RXVNCE`;
function resolveTrack(t){
  if(!resCache.has(t.key)){const p=_resolve(t);resCache.set(t.key,p);p.catch(()=>resCache.delete(t.key))}
  return resCache.get(t.key);
}
async function _resolve(t){
  if(t.src==='au')return{url:auStream(t.id),mode:'full'};
  if(t.src==='yt')return{url:await ytStream(t.id),mode:'full'};
  if(t.alt&&!t.noFull)return{url:auStream(t.alt.id),mode:'full'};            // same song exists on Audius: full track, no bridge needed
  if(S.full&&!t.noFull){try{const id=await ytMatch(t);return{url:await ytStream(id),mode:'full'}}catch(e){console.warn('YouTube bridge failed:',e)}}
  return{url:t.url,mode:'preview'};
}
async function playIndex(i){
  if(i<0||i>=S.queue.length)return;
  S.qi=i;const t=S.queue[i],tok=++loadTok;syncNow();renderPanel();
  $('#btnPlay').innerHTML=ICON.wait;
  try{
    if(t.src!=='au'&&!resCache.has(t.key)&&(t.src==='yt'||S.full))$('#nowA').textContent='Finding the full track…';
    const r=await resolveTrack(t);if(tok!==loadTok)return;
    t.mode=r.mode;if(r.mode==='full'&&t.fullDur)t.dur=t.fullDur;
    if(r.mode==='preview'&&S.full&&t.src==='ap'&&!warned){warned=true;toast('Full track unavailable right now — playing the 30s preview')}
    audio.src=r.url;audio.currentTime=0;await audio.play();
    failStreak=0;pushRecent(t);syncNow();
    const nx=S.queue[S.qi+1];if(nx&&nx.src!=='au'&&!S.shuffle)resolveTrack(nx).catch(()=>{});
  }catch(e){
    if(tok!==loadTok)return;
    if(e&&e.name==='NotAllowedError'){setPlayIcon();toast('Press play to start');return}
    console.warn('play failed',t.key,e);handleFail(t,tok);
  }
  syncNow();
}
let retried={};
function handleFail(t,tok){
  const now=Date.now();if(failAt[t.key]&&now-failAt[t.key]<500)return;failAt[t.key]=now;   // play() rejection + error event fire together
  const n=retried[t.key]=(retried[t.key]||0)+1;
  if(t.src==='au'&&n===1){
    const idx=AU_HOSTS.indexOf(auHost);auHost=AU_HOSTS[(idx+1)%AU_HOSTS.length];
    audio.src=auStream(t.id);audio.play().then(()=>{failStreak=0;pushRecent(t);syncNow()}).catch(()=>{});return;
  }
  if(t.src!=='au'&&n<=2){                       // stale signed URL? re-resolve once; then drop to the 30s preview
    if(n===2&&t.src==='ap')t.noFull=true;
    resCache.delete(t.key);playIndex(S.qi);return;
  }
  skipBad(t,tok);
}
function skipBad(t,tok){
  failStreak++;toast(`Can't play “${t.title}”`+(failStreak<4&&S.qi<S.queue.length-1?' — skipping':''));
  setPlayIcon();
  if(failStreak<4&&S.qi<S.queue.length-1&&tok===loadTok)setTimeout(()=>{if(tok===loadTok)playIndex(S.qi+1)},900);
}
function pushRecent(t){S.recent=[slim(t),...S.recent.filter(x=>x.key!==t.key)].slice(0,40);save()}
function playList(tracks,i=0,shuffle=false){
  S.queue=tracks.slice();shufHist=[];retried={};
  if(shuffle){S.shuffle=true;store.set('shuffle',true);syncModes();i=Math.floor(Math.random()*S.queue.length)}
  playIndex(i);
}
async function next(auto){
  if(!S.queue.length)return;
  if(auto&&S.repeat===2){audio.currentTime=0;audio.play();return}
  let n;
  if(S.shuffle&&S.queue.length>1){shufHist.push(S.qi);do{n=Math.floor(Math.random()*S.queue.length)}while(n===S.qi)}
  else n=S.qi+1;
  if(n>=S.queue.length){
    if(S.repeat===1)n=0;
    else{
      const more=await autoplayMore();if(more){n=S.qi+1}else{audio.pause();audio.currentTime=0;setPlayIcon();return}
    }
  }
  playIndex(n);
}
function prev(){
  if(audio.currentTime>3||!S.queue.length){audio.currentTime=0;return}
  if(S.shuffle&&shufHist.length){playIndex(shufHist.pop());return}
  playIndex(S.qi>0?S.qi-1:(S.repeat===1?S.queue.length-1:0));
}
async function autoplayMore(){
  const t=cur();if(!t||t.src==='ap')return false;
  try{
    let more=[];
    if(t.src==='au')more=(await au('/tracks/trending',{time:'week',limit:25,...(t.genre?{genre:t.genre}:{})})).map(normAu).filter(Boolean);
    more=more.filter(m=>!S.queue.some(q=>q.key===m.key));
    if(!more.length)return false;S.queue.push(...more.map(reg));toast('Autoplay: more '+(t.genre||'tracks'));renderPanel();return true;
  }catch{return false}
}
function toggle(){
  if(!cur()){const l=$('.list');if(l&&l._tracks&&l._tracks.length)playList(l._tracks,0);else if(S.recent.length)playList(S.recent,0);return}
  if(audio.paused){if(!audio.src)playIndex(S.qi);else audio.play().catch(()=>{})}else audio.pause();

});

function setVol(v){S.vol=v;audio.volume=v/100;$('#vol').value=v;$('#vol').style.setProperty('--p',v+'%');$('#btnMute').innerHTML=(S.muted||v==0)?ICON.mute:ICON.vol;store.set('vol',v)}

/* Search */
const SC=new Map();let searchSeq=0;
const FILTERS=[['all','All'],['songs','Songs'],['artists','Artists'],['albums','Albums'],['indie','Indie'],['yt','YouTube']];
async function fetchSearch(q){
  if(SC.has(q))return SC.get(q);
  const [ap,aut,auu]=await Promise.allSettled([apSearchAll(q),au('/tracks/search',{query:q,limit:30}),au('/users/search',{query:q,limit:8})]);
  const d={q,errs:[],songs:[],artists:[],albums:[],indie:[],indieArtists:[]};
  const apv=ap.status==='fulfilled'?ap.value:null;
  if(!apv)d.errs.push('Apple catalog: '+(ap.reason&&ap.reason.message||'unreachable'));
  const auT=aut.status==='fulfilled'?aut.value.map(normAu).filter(Boolean):null;
  if(!auT)d.errs.push('Audius: '+(aut.reason&&aut.reason.message||'unreachable'));
  if(auu.status==='fulfilled')d.indieArtists=auu.value.map(normAuUser).filter(u=>u.name);
  d.albums=apv?apv.albums:[];d.artists=apv?apv.artists:[];d.indie=auT||[];
  const Q=nz(q);d.artists.sort((a,b)=>(nz(b.name)===Q)-(nz(a.name)===Q));
  const m=new Map();
  const add=(t,rank)=>{
    const k=nz(t.artist)+'|'+nz(t.title),sc=relevance(q,t,rank),ex=m.get(k);
    if(!ex){m.set(k,{t,sc});return}
    if(t.src==='au'&&ex.t.src==='ap'){ex.t.alt=t;ex.sc=Math.max(ex.sc,sc)}
    else if(t.src==='ap'&&ex.t.src==='au'){t.alt=ex.t;m.set(k,{t,sc:Math.max(ex.sc,sc)})}
  };
  (apv?apv.songs:[]).forEach((t,i)=>add(t,i));(auT||[]).forEach((t,i)=>add(t,i+2));
  d.songs=[...m.values()].sort((a,b)=>b.sc-a.sc).map(x=>{x.t._sc=x.sc;return x.t});
  SC.set(q,d);return d;
}

/* Typeahead */
const sug=$('#sug'),qi=$('#q');let sugList=[],sugI=-1,sugSeq=0,sugT;
function closeSug(){sug.hidden=true;sugI=-1;sugSeq++;clearTimeout(sugT)}
function paintSug(items){
  sugList=items;sugI=-1;if(!items.length){closeSug();return}
  sug.innerHTML=items.map((x,i)=>`<div class="sg" data-i="${i}">${x.icon}<div class="sgt"><div class="sgl">${x.label}</div>${x.sub?`<div class="ra">${esc(x.sub)}</div>`:''}</div>${x.hist?`<button class="x" data-del="${i}" title="Remove">✕</button>`:''}</div>`).join('');
  sug.hidden=false;
}
function histItems(q){
  const Q=q.toLowerCase();
  return S.shist.filter(h=>!Q||(h.toLowerCase().includes(Q)&&h.toLowerCase()!==Q)).slice(0,q?3:8)
    .map(h=>({hist:1,text:h,label:esc(h),icon:'<span class="sgi">↺</span>',run:()=>doSearch(h)}));
}
async function suggest(q){
  const seq=++sugSeq,first={label:`Search “${esc(q)}”`,icon:'<span class="sgi">⌕</span>',run:()=>doSearch(q)};
  paintSug([first,...histItems(q)]);
  const r=await apSuggest(q);if(seq!==sugSeq||qi.value.trim()!==q)return;
  const items=[first,...histItems(q)];
  r.artists.forEach(a=>items.push({label:esc(a.name),sub:'Artist'+(a.genre?' · '+a.genre:''),icon:`<span class="sgi">${avatar(a.name)}</span>`,run:()=>{closeSug();go('apartist',{id:a.id})}}));
  r.songs.forEach(t=>items.push({label:esc(t.title),sub:'Song · '+t.artist,icon:`<span class="sgi">${artHtml(t.artSm,false,initials(t.artist))}</span>`,run:()=>doSearch(t.title+' '+t.artist)}));
  r.albums.forEach(a=>items.push({label:esc(a.title),sub:'Album · '+a.artist,icon:`<span class="sgi">${artHtml(a.art,false,initials(a.artist))}</span>`,run:()=>{closeSug();go('album',{id:a.id})}}));
  paintSug(items);
}
qi.addEventListener('input',()=>{clearTimeout(sugT);const q=qi.value.trim();if(!q){paintSug(histItems(''));return}sugT=setTimeout(()=>suggest(q),180)});
qi.addEventListener('focus',()=>{const q=qi.value.trim();if(!q)paintSug(histItems(''));else suggest(q)});
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(sug.hidden||!sugList.length)return;e.preventDefault();
    sugI=(sugI+(e.key==='ArrowDown'?1:-1)+sugList.length)%sugList.length;
    $$('.sg',sug).forEach((el,i)=>el.classList.toggle('on',i===sugI));
  }else if(e.key==='Enter'&&sugI>=0){e.preventDefault();const it=sugList[sugI];closeSug();it.run();qi.blur()}
  else if(e.key==='Escape')closeSug();
});
sug.addEventListener('mousedown',e=>{
  e.preventDefault();
  const d=e.target.closest('[data-del]');
  if(d){const it=sugList[+d.dataset.del];S.shist=S.shist.filter(x=>x!==it.text);store.set('shist',S.shist);paintSug(histItems(qi.value.trim()));return}
  const s=e.target.closest('.sg');if(s){const it=sugList[+s.dataset.i];closeSug();it.run();qi.blur()}
});
document.addEventListener('mousedown',e=>{if(!e.target.closest('.sw'))closeSug()});

/* Source status panel (so problems can be diagnosed from the browser) */
async function showStatus(){
  const old=$('.modal');if(old)old.remove();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="mbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Source status</h2><button class="iconbtn" id="mx">✕</button></div><div class="sub" style="margin:6px 0 14px">Live checks run from your browser right now.</div><div id="st"></div></div>`;
  document.body.appendChild(m);$('#mx',m).onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
  const st=$('#st',m);let n=0;
  const test=(name,fn)=>{
    const id='stl'+(n++);st.insertAdjacentHTML('beforeend',`<div class="stl" id="${id}"><span class="dot"></span><b>${esc(name)}</b><span class="sub">testing…</span></div>`);
    const set=(ok,t)=>{const e=document.getElementById(id);if(!e)return;e.className='stl '+(ok?'ok':'bad');e.lastElementChild.textContent=t};
    const t0=performance.now();
    return fn().then(()=>{set(1,Math.round(performance.now()-t0)+' ms');return 1}).catch(e=>{set(0,String((e&&e.message)||'failed').slice(0,60));return 0});
  };
  test('Audius — full indie tracks',()=>au('/tracks/trending',{limit:1}));
  test('Apple catalog — search & metadata',()=>itj(IT+'/search?term=test&media=music&entity=song&limit=1'));
  test('Apple charts — Home',()=>apCharts());
  test('LRCLIB — lyrics',()=>fj('https://lrclib.net/api/search?q=test',6000));
  const b=(await ytBackends()).slice(0,12);
  st.insertAdjacentHTML('beforeend','<h3>YouTube bridge (full mainstream songs)</h3>');
  const res=await Promise.all(b.map(x=>test((x.k==='p'?'Piped · ':'Invidious · ')+new URL(x.h).host,()=>fj(x.k==='p'?x.h+'/search?q=test&filter=music_songs':x.h+'/api/v1/search?q=test&type=video',6000).then(j=>{if(j&&j.error)throw Error(String(j.error))}))));
  const up=res.filter(Boolean).length;
  st.insertAdjacentHTML('beforeend',`<div class="status"><b>${up}/${b.length}</b> bridge instances answered. ${up?'Mainstream songs should play in full.':'Mainstream songs will fall back to 30-second previews; indie tracks and previews are unaffected.'}</div>`);
}

/* Library */
function viewLibrary(){
  const tab=S.view.tab||'liked';
  main.innerHTML=`<h1>Your Library</h1><div class="chips">${[['liked','Liked ('+S.liked.length+')'],['lists','Playlists ('+S.lists.length+')'],['recent','Recent']].map(([k,n])=>`<button class="chip${k===tab?' on':''}" data-act="libtab" data-t="${k}">${n}</button>`).join('')}</div><div id="lib"></div>`;
  const lib=$('#lib');
  if(tab==='liked'){lib.innerHTML=(S.liked.length?`<div class="btns"><button class="btn pri" data-act="playall">▶ Play</button><button class="btn" data-act="shuffle">Shuffle</button></div>`:'')+listHtml(S.liked,'Tap the heart on any track to save it here.');const l=$('.list',lib);if(l)l._tracks=S.liked}
  if(tab==='recent'){lib.innerHTML=(S.recent.length?`<div class="btns"><button class="btn pri" data-act="playall">▶ Play</button><button class="btn" data-act="clearrecent">Clear history</button></div>`:'')+listHtml(S.recent,'Nothing played yet.');const l=$('.list',lib);if(l)l._tracks=S.recent}
  if(tab==='lists'){
    lib.innerHTML=`<div class="btns"><button class="btn pri" id="mk">+ New playlist</button></div><div class="grid">${S.lists.map(l=>`<div class="card" data-plcard="${l.id}">${artHtml(l.tracks[0]&&l.tracks[0].art,false,initials(l.name))}<div class="t">${esc(l.name)}</div><div class="a">${l.tracks.length} tracks</div></div>`).join('')}</div>${S.lists.length?'':'<div class="status">No playlists yet.</div>'}`;
    $('#mk').onclick=()=>{const l=newList();if(l)go('list',{id:l.id})};
    $$('[data-plcard]',lib).forEach(c=>c.onclick=()=>go('list',{id:c.dataset.plcard}));
  }
}
function viewList(){
  const l=S.lists.find(x=>x.id===S.view.id);if(!l){go('library');return}
  main.innerHTML=`<div class="hd">${artHtml(l.tracks[0]&&l.tracks[0].art,false,initials(l.name))}<div class="meta"><div class="sub">PLAYLIST</div><h1>${esc(l.name)}</h1><div class="sub">${l.tracks.length} tracks</div></div></div>
   <div class="btns"><button class="btn pri" data-act="playall">▶ Play</button><button class="btn" data-act="shuffle">Shuffle</button><button class="btn" data-act="rename">Rename</button><button class="btn" data-act="delpl">Delete</button></div>${listHtml(l.tracks,'Empty. Use ⋯ on any track → Add to playlist.')}`;
  const li=$('.list',main);if(li)li._tracks=l.tracks;
}
async function viewArtist(){
  const id=S.view.id;main.innerHTML='<div class="skel" style="height:180px"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const[u,tr]=await Promise.all([au('/users/'+encodeURIComponent(id)),au('/users/'+encodeURIComponent(id)+'/tracks',{limit:60,sort:'plays'})]);
    if(S.view.name!=='artist'||S.view.id!==id)return;
    const p=normAuUser(u),tracks=tr.map(normAu).filter(Boolean);
    main.innerHTML=`<div class="hd">${artHtml(p.pic,true,initials(p.name))}<div class="meta"><div class="sub">ARTIST${p.verified?' · VERIFIED':''}</div><h1>${esc(p.name)}</h1><div class="sub">@${esc(p.handle||'')} · ${nfmt(p.followers)||0} followers · ${p.tracks||tracks.length} tracks</div></div></div>
     <div class="btns"><button class="btn pri" data-act="playall">▶ Play</button><button class="btn" data-act="shuffle">Shuffle</button></div><h2>Popular</h2>${listHtml(tracks,'No public tracks.')}`;
    const li=$('.list',main);if(li)li._tracks=tracks;
  }catch(e){main.innerHTML=errBox('Couldn’t load artist ('+e.message+').')}
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='range';
  if(e.key==='Escape'){closeMenu();if(typing)document.activeElement.blur();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='/'){e.preventDefault();$('#q').focus();$('#q').select()}
  else if(k===' '){e.preventDefault();toggle()}
  else if(k==='ArrowRight'){e.preventDefault();e.shiftKey?next(false):(audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5))}
  else if(k==='ArrowLeft'){e.preventDefault();e.shiftKey?prev():(audio.currentTime=Math.max(0,audio.currentTime-5))}
  else if(k==='ArrowUp'){e.preventDefault();S.muted=false;audio.muted=false;setVol(Math.min(100,S.vol+5))}
  else if(k==='ArrowDown'){e.preventDefault();setVol(Math.max(0,S.vol-5))}
  else if(k==='n'||k==='N')next(false);else if(k==='p'||k==='P')prev();
  else if(k==='m'||k==='M')$('#btnMute').click();
  else if(k==='l'||k==='L')$('#btnLike').click();
  else if(k==='s'||k==='S')$('#btnShuf').click();
  else if(k==='r'||k==='R')$('#btnRep').click();
  else if(k==='q'||k==='Q')togglePanel();
});

/* ---------- boot ---------- */
setVol(S.vol);syncModes();setPlayIcon();syncNow();render();
// restore last track (paused) so the player isn't empty after reload
(()=>{const p=store.get('pos',null);if(p&&p.t){S.queue=[reg(p.t)];S.qi=0;syncNow()}})();
function syncFullBtn(){$('#btnFull').textContent='Full songs: '+(S.full?'ON':'OFF');$('#btnFull').title='Play mainstream songs in full through the YouTube bridge (falls back to 30s previews)'}
$('#btnFull').onclick=()=>{S.full=!S.full;store.set('full',S.full);resCache.clear();syncFullBtn();toast(S.full?'Mainstream songs will try full playback':'Mainstream songs play as 30s previews');if(S.view.name==='search')paintSearch()};
$('#btnStatus').onclick=showStatus;$('#btnBack').onclick=back;syncFullBtn();
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.card,.topc');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}},{passive:true});
</script>
