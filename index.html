<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RXVNCE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}body{min-height:100vh;padding-bottom:105px}.app{max-width:1250px;margin:auto;padding:28px 24px}.top{display:flex;align-items:center;gap:22px;margin-bottom:30px}.logo{font-size:27px;font-weight:900;letter-spacing:.28em}.search{flex:1;display:flex;background:#111;border:1px solid #252525;border-radius:14px;overflow:hidden}.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:14px 17px;font-size:15px}.search button{background:#fff;color:#000;border:0;padding:0 22px;font-weight:800;cursor:pointer}.hero{padding:28px 0 20px}.hero h1{font-size:42px;margin:0 0 8px}.hero p{color:#777;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#0b0b0b;border:1px solid #181818;border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{border-color:#444;transform:translateY(-2px)}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111}.meta{padding:13px}.title{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.artist{color:#777;font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{color:#777;padding:35px 0}.player{position:fixed;left:0;right:0;bottom:0;height:92px;background:#050505;border-top:1px solid #1c1c1c;display:flex;align-items:center;gap:18px;padding:12px 22px;z-index:10}.now{width:260px;min-width:180px;display:flex;align-items:center;gap:12px}.now img{width:55px;height:55px;object-fit:cover;border-radius:7px;background:#111}.nowtext{min-width:0}.nowtitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowartist{font-size:12px;color:#777;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;gap:13px}.ctrl{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}.play{width:42px;height:42px;border-radius:50%;background:#fff;color:#000!important;font-size:17px}.timeline{flex:1;display:flex;align-items:center;gap:9px;color:#777;font-size:11px}.timeline input{width:100%;accent-color:#fff}.volume{width:110px;display:flex;gap:8px;align-items:center}.volume input{width:75px;accent-color:#fff}@media(max-width:750px){.top{flex-wrap:wrap}.search{order:2;flex-basis:100%}.hero h1{font-size:31px}.now{display:none}.volume{display:none}.player{gap:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:20px 14px}}
</style></head>
<body>
<div class="app">
  <div class="top"><div class="logo">RXVNCE</div><form class="search" id="searchForm"><input id="query" placeholder="Search music..." autocomplete="off"><button>SEARCH</button></form></div>
  <section class="hero"><h1 id="heading">Discover</h1><p>Music search powered by a public Piped API.</p></section>
  <div id="status" class="status">Loading music...</div><div id="results" class="grid"></div>
</div>
<div class="player">
  <div class="now"><img id="nowImg" src="" alt=""><div class="nowtext"><div id="nowTitle" class="nowtitle">Nothing playing</div><div id="nowArtist" class="nowartist">Search for something to start</div></div></div>
  <div class="controls"><button class="ctrl" id="prev">↶</button><button class="ctrl play" id="play">▶</button><button class="ctrl" id="next">↷</button></div>
  <div class="timeline"><span id="current">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div>
  <div class="volume">🔊<input id="volume" type="range" min="0" max="1" step=".01" value="1"></div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const INSTANCES=[
  'https://pipedapi.kavin.rocks',
  'https://pipedapi.leptons.xyz',
  'https://pipedapi.adminforge.de',
  'https://api.piped.yt',
  'https://pipedapi.drgns.space',
  'https://pipedapi.owo.si',
  'https://piped-api.privacy.com.de'
];
let api=INSTANCES[0], tracks=[], index=-1, loading=false;
const $=id=>document.getElementById(id), audio=$('audio');
function fmt(s){if(!Number.isFinite(s))return '0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function videoId(value){try{const u=new URL(value,location.href);const v=u.searchParams.get('v');if(v)return v;const m=u.pathname.match(/(?:watch\/|shorts\/|embed\/)([A-Za-z0-9_-]{6,})/);if(m)return m[1]}catch{} const m=String(value||'').match(/[?&]v=([A-Za-z0-9_-]{6,})/);return m?m[1]:String(value||'').split('/').pop()}
async function getJSON(path){let last;for(const host of [api,...INSTANCES.filter(x=>x!==api)]){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9000);try{const r=await fetch(host+path,{signal:controller.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error(host+' → HTTP '+r.status);const j=await r.json();clearTimeout(timer);api=host;return j}catch(e){clearTimeout(timer);last=e}}throw last}
function render(){const box=$('results');box.innerHTML='';if(!tracks.length){$('status').textContent='No results found.';return}$('status').textContent='';tracks.forEach((t,i)=>{const c=document.createElement('article');c.className='card';c.innerHTML=`<img class="thumb" src="${t.thumbnail||''}" loading="lazy"><div class="meta"><div class="title">${esc(t.title||'Untitled')}</div><div class="artist">${esc(t.uploaderName||'Unknown artist')} · ${fmt(t.duration)}</div></div>`;c.onclick=()=>play(i);box.appendChild(c)})}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function search(q){$('heading').textContent=q?'Results for “'+q+'”':'Discover';$('status').textContent='Searching…';$('results').innerHTML='';try{const j=await getJSON('/search?q='+encodeURIComponent(q)+'&filter=music');tracks=(j.items||[]).filter(x=>x.type==='stream'&&x.url).map(x=>({id:videoId(x.url),url:x.url,title:x.title,thumbnail:x.thumbnail,uploaderName:x.uploaderName,duration:x.duration})).filter(x=>x.id);render()}catch(e){$('status').textContent='The public music service is unreachable from this browser right now. If you opened index.html directly, deploy RXVNCE to GitHub Pages and try again.';console.error(e)}}
async function play(i){if(i<0||i>=tracks.length||loading)return;index=i;const t=tracks[i];loading=true;$('nowTitle').textContent=t.title||'Loading…';$('nowArtist').textContent=t.uploaderName||'';$('nowImg').src=t.thumbnail||'';try{const id=t.id||t.url?.split('/').pop();const j=await getJSON('/streams/'+encodeURIComponent(id));const streams=(j.audioStreams||[]).filter(x=>x.url);if(!streams.length)throw Error('No audio stream');streams.sort((a,b)=>(b.bitrate||0)-(a.bitrate||0));audio.src=streams[0].url;await audio.play();$('play').textContent='Ⅱ'}catch(e){console.error(e);$('nowArtist').textContent='Playback unavailable';}finally{loading=false}}
$('searchForm').onsubmit=e=>{e.preventDefault();const q=$('query').value.trim();if(q)search(q)};$('play').onclick=()=>{if(!audio.src){if(tracks.length)play(0);return}audio.paused?(audio.play(),$('play').textContent='Ⅱ'):(audio.pause(),$('play').textContent='▶')};$('prev').onclick=()=>play(Math.max(0,index-1));$('next').onclick=()=>play(index+1<tracks.length?index+1:0);audio.onended=()=>play(index+1<tracks.length?index+1:0);audio.ontimeupdate=()=>{$('current').textContent=fmt(audio.currentTime);$('seek').value=audio.duration?(audio.currentTime/audio.duration)*100:0};audio.onloadedmetadata=()=>{$('duration').textContent=fmt(audio.duration)};$('seek').oninput=e=>{if(audio.duration)audio.currentTime=(e.target.value/100)*audio.duration};$('volume').oninput=e=>audio.volume=e.target.value;
search('electronic');
</script></body></html>
